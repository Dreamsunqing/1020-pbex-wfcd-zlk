name: Package Workbench
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run pack:mac
          - os: windows-latest
            command: npm run pack:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.os }}
          path: dist/*.zip
