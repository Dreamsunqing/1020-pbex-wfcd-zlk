<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#536c87"/></marker></defs><rect width="1600" height="1080" fill="#f5f8fc"/><g font-family="PingFang SC,Arial,sans-serif"><text x="35" y="60" font-size="34" font-weight="700" fill="#20354b">从上游到界面</text><text x="35" y="103" font-size="21" fill="#53677b">JSON 是材料，MJS 是处理逻辑；实线表示读取或产出。</text><polyline points="490,245 570,255" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="235" width="56" height="30" rx="5" fill="#f5f8fc"/><text x="530" y="256" font-size="18" text-anchor="middle" fill="#344f6b">读取</text><polyline points="790,345 790,455" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="733.5" y="385" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="790" y="406" font-size="18" text-anchor="middle" fill="#344f6b">按实体聚合</text><polyline points="1330,340 1330,395 1045,395 1045,550 1010,550" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="979" y="380" width="132" height="30" rx="5" fill="#f5f8fc"/><text x="1045" y="401" font-size="18" text-anchor="middle" fill="#344f6b">分类与优先级</text><polyline points="490,550 570,550" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="483" y="535" width="94" height="30" rx="5" fill="#f5f8fc"/><text x="530" y="556" font-size="18" text-anchor="middle" fill="#344f6b">递归处理</text><polyline points="1010,550 1090,550" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1003" y="535" width="94" height="30" rx="5" fill="#f5f8fc"/><text x="1050" y="556" font-size="18" text-anchor="middle" fill="#344f6b">字段证据</text><polyline points="790,645 750,820" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="713.5" y="717.5" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="770" y="738.5" font-size="18" text-anchor="middle" fill="#344f6b">结构化产物</text><polyline points="1330,645 1330,735 1110,735 1110,910 1080,910" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1034.5" y="720" width="151" height="30" rx="5" fill="#f5f8fc"/><text x="1110" y="741" font-size="18" text-anchor="middle" fill="#344f6b">纳入完整工作包</text><polyline points="750,1000 750,1040 1360,1040 1360,1000" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="993" y="1025" width="124" height="30" rx="5" fill="#f5f8fc"/><text x="1055" y="1046" font-size="18" text-anchor="middle" fill="#344f6b">读取 / 裁剪</text><rect x="30" y="150" width="460" height="190" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="52" y="189" font-size="25" font-weight="650" fill="#3064a3">① 原始来源 · 保持只读</text><text x="52" y="229" font-size="20" fill="#263f55">官方 Export*.json / Plus Export*.json</text><text x="52" y="259" font-size="20" fill="#263f55">WFCD 分类与 i18n / Oracle 清单</text><text x="52" y="289" font-size="20" fill="#263f55">library.mjs → 文件清单与哈希</text><rect x="570" y="165" width="440" height="180" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="592" y="204" font-size="25" font-weight="650" fill="#3064a3">② 识别结构与完整 ID</text><text x="592" y="244" font-size="20" fill="#263f55">full-inputs.mjs</text><text x="592" y="274" font-size="20" fill="#263f55">map / array / group 分类</text><text x="592" y="304" font-size="20" fill="#263f55">字典单独索引；reference 留原结构</text><rect x="1090" y="150" width="480" height="190" rx="15" fill="#fff3dc" stroke="#986a16" stroke-width="2"/><text x="1112" y="189" font-size="25" font-weight="650" fill="#986a16">规则 JSON · 决定怎么处理</text><text x="1112" y="229" font-size="20" fill="#263f55">merge-full-contract.json</text><text x="1112" y="259" font-size="20" fill="#263f55">catalogs / fields / priority / nested</text><text x="1112" y="289" font-size="20" fill="#263f55">merge-overrides.json · 带哈希的人工修订</text><rect x="30" y="455" width="460" height="190" rx="15" fill="#e5f5ef" stroke="#167962" stroke-width="2"/><text x="52" y="494" font-size="25" font-weight="650" fill="#167962">深层字段与关系</text><text x="52" y="534" font-size="20" fill="#263f55">nested.mjs / text-localization.mjs</text><text x="52" y="564" font-size="20" fill="#263f55">对象逐字段；有 ID 数组按身份</text><text x="52" y="594" font-size="20" fill="#263f55">无 ID 数组保留整组候选</text><rect x="570" y="455" width="440" height="190" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="592" y="494" font-size="25" font-weight="650" fill="#3064a3">③ 合并引擎</text><text x="592" y="534" font-size="20" fill="#263f55">build.mjs → full-build.mjs</text><text x="592" y="564" font-size="20" fill="#263f55">选择字段、解析语言、生成关系</text><text x="592" y="594" font-size="20" fill="#263f55">冲突与缺失保留可复核状态</text><rect x="1090" y="455" width="480" height="190" rx="15" fill="#fff3dc" stroke="#986a16" stroke-width="2"/><text x="1112" y="494" font-size="25" font-weight="650" fill="#986a16">与结果一起保存证据</text><text x="1112" y="534" font-size="20" fill="#263f55">reports/provenance.json</text><text x="1112" y="564" font-size="20" fill="#263f55">原文件 + hash + JSON Pointer</text><text x="1112" y="594" font-size="20" fill="#263f55">issues / coverage / source-records</text><rect x="420" y="820" width="660" height="180" rx="15" fill="#e5f5ef" stroke="#167962" stroke-width="2"/><text x="442" y="859" font-size="25" font-weight="650" fill="#167962">④ 校验后切换当前版本</text><text x="442" y="899" font-size="20" fill="#263f55">repository.mjs：暂存 → 逐文件哈希 → current</text><text x="442" y="929" font-size="20" fill="#263f55">items/*.json · recipes · relations · rewards</text><text x="442" y="959" font-size="20" fill="#263f55">localizations · images · manifest.json</text><rect x="1150" y="820" width="420" height="180" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="1172" y="859" font-size="25" font-weight="650" fill="#3064a3">⑤ 不同界面按需读取</text><text x="1172" y="899" font-size="20" fill="#263f55">service.mjs → 合并汇总 / 来源回查</text><text x="1172" y="929" font-size="20" fill="#263f55">player-bundle.mjs → 预构建资料库</text><text x="1172" y="959" font-size="20" fill="#263f55">世界状态 / 掉落表复用实体与图片</text></g></svg>