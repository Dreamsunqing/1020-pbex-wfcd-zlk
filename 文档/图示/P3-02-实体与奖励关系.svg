<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#536c87"/></marker></defs><rect width="1600" height="1080" fill="#f5f8fc"/><g font-family="PingFang SC,Arial,sans-serif"><text x="35" y="60" font-size="34" font-weight="700" fill="#20354b">实体与奖励关系</text><text x="35" y="103" font-size="21" fill="#53677b">连线旁是实际关系或字段；身份、语言键、奖励表路径是三个键空间。</text><polyline points="795,430 795,300" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="731" y="350" width="128" height="30" rx="5" fill="#f5f8fc"/><text x="795" y="371" font-size="18" text-anchor="middle" fill="#344f6b">has-ability</text><polyline points="560,520 515,520 515,310 250,310 250,330" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="306" y="295" width="148" height="30" rx="5" fill="#f5f8fc"/><text x="380" y="316" font-size="18" text-anchor="middle" fill="#344f6b">has-component</text><polyline points="265,750 265,700 525,700 525,520 560,520" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="476" y="685" width="98" height="30" rx="5" fill="#f5f8fc"/><text x="525" y="706" font-size="18" text-anchor="middle" fill="#344f6b">produces</text><polyline points="265,750 115,700 115,540 250,540 250,495" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="66" y="525" width="98" height="30" rx="5" fill="#f5f8fc"/><text x="115" y="546" font-size="18" text-anchor="middle" fill="#344f6b">requires</text><polyline points="1340,300 1340,460" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1283.5" y="365" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="1340" y="386" font-size="18" text-anchor="middle" fill="#344f6b">完整表路径</text><polyline points="1110,550 1030,520" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1041" y="520" width="58" height="30" rx="5" fill="#f5f8fc"/><text x="1070" y="541" font-size="18" text-anchor="middle" fill="#344f6b">type</text><polyline points="795,610 795,825" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="738.5" y="702.5" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="795" y="723.5" font-size="18" text-anchor="middle" fill="#344f6b">图片元数据</text><polyline points="265,930 265,1035 795,1035 795,1000" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="481" y="1020" width="98" height="30" rx="5" fill="#f5f8fc"/><text x="530" y="1041" font-size="18" text-anchor="middle" fill="#344f6b">resultId</text><polyline points="1340,640 1340,820" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1293" y="715" width="94" height="30" rx="5" fill="#f5f8fc"/><text x="1340" y="736" font-size="18" text-anchor="middle" fill="#344f6b">静态候选</text><polyline points="1110,910 1070,910 1070,705 1050,705 1050,565 1030,520" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="984.5" y="690" width="151" height="30" rx="5" fill="#f5f8fc"/><text x="1060" y="711" font-size="18" text-anchor="middle" fill="#344f6b">确认后显示奖励</text><rect x="560" y="135" width="470" height="165" rx="15" fill="#e5f5ef" stroke="#167962" stroke-width="2"/><text x="582" y="174" font-size="25" font-weight="650" fill="#167962">技能实体</text><text x="582" y="214" font-size="20" fill="#263f55">has-ability · 完整 abilityUniqueName</text><text x="582" y="244" font-size="20" fill="#263f55">同 ID 的内嵌 / 独立技能可汇合</text><text x="582" y="274" font-size="20" fill="#263f55">ability-links.mjs · 强化与移植证据</text><rect x="30" y="330" width="440" height="165" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="52" y="369" font-size="25" font-weight="650" fill="#3064a3">组件实体</text><text x="52" y="409" font-size="20" fill="#263f55">has-component / requires</text><text x="52" y="439" font-size="20" fill="#263f55">成员关系与配方消耗分别保留</text><text x="52" y="469" font-size="20" fill="#263f55">count / slot / source 伴随关系</text><rect x="560" y="430" width="470" height="180" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="582" y="469" font-size="25" font-weight="650" fill="#3064a3">统一实体 · items/*.json</text><text x="582" y="509" font-size="20" fill="#263f55">完整 /Lotus/... 或 wf:&lt;kind&gt;/&lt;id&gt;</text><text x="582" y="539" font-size="20" fill="#263f55">name / description 按语言存</text><text x="582" y="569" font-size="20" fill="#263f55">relations.json 连接各实体</text><rect x="1110" y="135" width="460" height="165" rx="15" fill="#fff3dc" stroke="#986a16" stroke-width="2"/><text x="1132" y="174" font-size="25" font-weight="650" fill="#986a16">Oracle · JobManifest.json</text><text x="1132" y="214" font-size="20" fill="#263f55">rewards = 完整奖励表路径</text><text x="1132" y="244" font-size="20" fill="#263f55">bounty-references.json 保留引用</text><text x="1132" y="274" font-size="20" fill="#263f55">清单引用不等于当前轮次确认</text><rect x="1110" y="460" width="460" height="180" rx="15" fill="#fff3dc" stroke="#986a16" stroke-width="2"/><text x="1132" y="499" font-size="25" font-weight="650" fill="#986a16">Plus · ExportRewards.json</text><text x="1132" y="539" font-size="20" fill="#263f55">表路径 → 池数组 → type / itemCount</text><text x="1132" y="569" font-size="20" fill="#263f55">reward-tables.json 保留全部表和池</text><text x="1132" y="599" font-size="20" fill="#263f55">probability 无值时不从 rarity 猜</text><rect x="30" y="750" width="470" height="180" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="52" y="789" font-size="25" font-weight="650" fill="#3064a3">蓝图与配方 · recipes.json</text><text x="52" y="829" font-size="20" fill="#263f55">蓝图 --produces→ 成品</text><text x="52" y="859" font-size="20" fill="#263f55">蓝图 --requires→ 材料 × 数量</text><text x="52" y="889" font-size="20" fill="#263f55">resultType 是成品身份依据</text><rect x="560" y="825" width="470" height="175" rx="15" fill="#e5f5ef" stroke="#167962" stroke-width="2"/><text x="582" y="864" font-size="25" font-weight="650" fill="#167962">共享图像描述与文件</text><text x="582" y="904" font-size="20" fill="#263f55">images.json / service.mjs 描述符</text><text x="582" y="934" font-size="20" fill="#263f55">蓝图底纹 + recipe.resultId 成品图</text><text x="582" y="964" font-size="20" fill="#263f55">LocalImages 读取共享图库，不复制</text><rect x="1110" y="820" width="460" height="180" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="1132" y="859" font-size="25" font-weight="650" fill="#3064a3">实时奖励是另一道判断</text><text x="1132" y="899" font-size="20" fill="#263f55">oracle-rewards.mjs</text><text x="1132" y="929" font-size="20" fill="#263f55">候选表 ∩ 有效世界状态奖励表</text><text x="1132" y="959" font-size="20" fill="#263f55">仅唯一命中才确认当前表</text></g></svg>