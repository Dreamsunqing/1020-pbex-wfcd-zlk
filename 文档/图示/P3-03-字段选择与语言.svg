<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#536c87"/></marker></defs><rect width="1600" height="1180" fill="#f5f8fc"/><g font-family="PingFang SC,Arial,sans-serif"><text x="35" y="60" font-size="34" font-weight="700" fill="#20354b">字段选择与语言</text><text x="35" y="103" font-size="21" fill="#53677b">“能显示”与“已确认”分开；规则暂选不抹掉冲突，语言回退不冒充翻译。</text><polyline points="800,290 800,340 265,340 265,405" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="504.5" y="325" width="56" height="30" rx="5" fill="#f5f8fc"/><text x="532.5" y="346" font-size="18" text-anchor="middle" fill="#344f6b">结构</text><polyline points="800,290 800,405" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="772" y="332.5" width="56" height="30" rx="5" fill="#f5f8fc"/><text x="800" y="353.5" font-size="18" text-anchor="middle" fill="#344f6b">语言</text><polyline points="800,290 800,340 1335,340 1335,405" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1030" y="325" width="75" height="30" rx="5" fill="#f5f8fc"/><text x="1067.5" y="346" font-size="18" text-anchor="middle" fill="#344f6b">优先级</text><polyline points="265,605 265,685 435,685 435,825 470,827.5" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="369" y="670" width="132" height="30" rx="5" fill="#f5f8fc"/><text x="435" y="691" font-size="18" text-anchor="middle" fill="#344f6b">递归后的候选</text><polyline points="800,605 800,755" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="743.5" y="665" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="800" y="686" font-size="18" text-anchor="middle" fill="#344f6b">按语言保留</text><polyline points="1335,605 1335,685 1165,685 1165,825 1130,827.5" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1108.5" y="670" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="1165" y="691" font-size="18" text-anchor="middle" fill="#344f6b">校验并选择</text><polyline points="800,900 800,930 360,930 360,960" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="523.5" y="915" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="580" y="936" font-size="18" text-anchor="middle" fill="#344f6b">读取时回退</text><polyline points="800,900 800,930 1210,930 1210,960" fill="none" stroke="#536c87" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="948.5" y="915" width="113" height="30" rx="5" fill="#f5f8fc"/><text x="1005" y="936" font-size="18" text-anchor="middle" fill="#344f6b">最后才渲染</text><rect x="110" y="145" width="1380" height="145" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="132" y="184" font-size="25" font-weight="650" fill="#3064a3">同一完整实体 ID · 来自多个来源的字段候选</text><text x="132" y="224" font-size="20" fill="#263f55">例如：官方中文 levelStats、WFCD 英文 description、Plus 语言键</text><text x="132" y="254" font-size="20" fill="#263f55">每个候选都带 file / hash / pointer / locale；原件不修改</text><rect x="30" y="405" width="470" height="200" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="52" y="444" font-size="25" font-weight="650" fill="#3064a3">结构：先理解再合并</text><text x="52" y="484" font-size="20" fill="#263f55">nested.mjs</text><text x="52" y="514" font-size="20" fill="#263f55">对象 → 子字段递归</text><text x="52" y="544" font-size="20" fill="#263f55">有身份数组 → 按完整 ID</text><text x="52" y="574" font-size="20" fill="#263f55">匿名数组 → 整组择优</text><rect x="565" y="405" width="470" height="200" rx="15" fill="#e5f5ef" stroke="#167962" stroke-width="2"/><text x="587" y="444" font-size="25" font-weight="650" fill="#167962">语言：三种输入分别处理</text><text x="587" y="484" font-size="20" fill="#263f55">full-inputs / text-localization</text><text x="587" y="514" font-size="20" fill="#263f55">官方语言目录：同 ID 的文本</text><text x="587" y="544" font-size="20" fill="#263f55">Plus / Oracle：完整语言键查字典</text><text x="587" y="574" font-size="20" fill="#263f55">WFCD i18n：ID → 本地化对象</text><rect x="1100" y="405" width="470" height="200" rx="15" fill="#fff3dc" stroke="#986a16" stroke-width="2"/><text x="1122" y="444" font-size="25" font-weight="650" fill="#986a16">取值：可验证的规则</text><text x="1122" y="484" font-size="20" fill="#263f55">full-build.mjs · resolve</text><text x="1122" y="514" font-size="20" fill="#263f55">字段优先级 ＞ 全局优先级</text><text x="1122" y="544" font-size="20" fill="#263f55">有效人工修订：值 + 原因 + hash</text><text x="1122" y="574" font-size="20" fill="#263f55">hash 过期 → 中止，不套旧修订</text><rect x="470" y="755" width="660" height="145" rx="15" fill="#e5f5ef" stroke="#167962" stroke-width="2"/><text x="492" y="794" font-size="25" font-weight="650" fill="#167962">保存结果 + 所有候选的依据</text><text x="492" y="834" font-size="20" fill="#263f55">items/*.json 与 localizations/{locale}.json</text><text x="492" y="864" font-size="20" fill="#263f55">reports/provenance.json 记录采用 / 冲突 / 修订</text><rect x="30" y="960" width="660" height="160" rx="15" fill="#fff3dc" stroke="#986a16" stroke-width="2"/><text x="52" y="999" font-size="25" font-weight="650" fill="#986a16">缺失和回退仍可辨认</text><text x="52" y="1039" font-size="20" fill="#263f55">缺名 / 缺引用 / 缺概率分别记录</text><text x="52" y="1069" font-size="20" fill="#263f55">请求语言 → 英文 → 其他已构建语言</text><text x="52" y="1099" font-size="20" fill="#263f55">fallback / partial 显示实际语言</text><rect x="850" y="960" width="720" height="160" rx="15" fill="#eaf1fc" stroke="#3064a3" stroke-width="2"/><text x="872" y="999" font-size="25" font-weight="650" fill="#3064a3">展示中间件不参与身份合并</text><text x="872" y="1039" font-size="20" fill="#263f55">inline-tokens.mjs + game-text.js</text><text x="872" y="1069" font-size="20" fill="#263f55">&lt;DT_...&gt; 转图标；未知标记保留</text><text x="872" y="1099" font-size="20" fill="#263f55">原文仍在 reference，可回查</text></g></svg>